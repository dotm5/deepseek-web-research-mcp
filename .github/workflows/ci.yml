name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24', 'lts/*']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci
      - run: npm run release:check
      - name: CLI and script syntax
        shell: bash
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
          for f in scripts/smoke.mjs scripts/load.mjs scripts/claude-advanced-smoke.mjs scripts/check-secrets.mjs tools/check-links.mjs tools/check-docs.mjs; do
            node --check "$f"
            node "$f" --help
          done
      - run: npm run test:install
