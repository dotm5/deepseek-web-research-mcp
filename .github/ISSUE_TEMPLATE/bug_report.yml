name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Attach no API keys, credentials or private page content. Use the Security policy for vulnerability reports."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One paragraph describing the defect.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit, release tag or package version.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Commands, tool arguments and expected versus actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output with credentials removed.
